<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kitzo marks</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; pointer-events: none; user-select: none; }
  #layer { position: fixed; inset: 0; overflow: hidden; }
  .m { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .m > .in { display: block; }
  .in svg { display: block; }
  .mark > .in { animation: mark-in 0.22s ease-out both; }
  .twinkle > .in { animation: mark-in 0.22s ease-out both, twinkle 1.1s ease-in-out 0.35s infinite; }
  .quick > .in { animation: spark 0.9s ease-out forwards; }
  .pop > .in { animation: bubble-pop 0.2s ease-out forwards; }
  .fade { transition: opacity 0.7s ease-in; opacity: 0 !important; }
  .ball { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
  .drop .ball { box-shadow: none; }
  .sticker, .popper { font-size: 40px; line-height: 1; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); }
  .spark { font-size: 16px; line-height: 1; color: #ffe66d; text-shadow: 0 0 6px #ffd27a; }
  .piece { border-radius: 2px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }
  .smoke { border-radius: 50%; background: radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.95), rgba(200, 200, 215, 0.6)); }
  .bubble {
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.75), rgba(170, 215, 255, 0.18) 60%, rgba(120, 180, 255, 0.05));
    box-shadow: 0 0 8px rgba(160, 200, 255, 0.45), inset 0 0 6px rgba(255, 255, 255, 0.4);
  }
  @keyframes mark-in { 0% { transform: scale(0.3); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
  @keyframes spark { 0% { transform: scale(0.4); opacity: 0; } 30% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.6) translateY(-10px); opacity: 0; } }
  @keyframes bubble-pop { to { transform: scale(1.5); opacity: 0; } }
  .scan-ring {
    position: absolute; left: 0; top: 0; width: 8px; height: 8px;
    border: 2px solid #5ac8ff; border-radius: 50%;
    box-shadow: 0 0 8px rgba(90, 200, 255, 0.6);
    transform: translate(-50%, -50%);
    animation: scan-ring 900ms ease-out forwards;
  }
  @keyframes scan-ring {
    from { width: 8px; height: 8px; opacity: 0.9; }
    to { width: 90px; height: 90px; opacity: 0; }
  }
  .boom-ring {
    position: absolute; left: 0; top: 0; width: 12px; height: 12px;
    border: 4px solid #ffd166; border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: boom-ring 620ms ease-out forwards;
  }
  @keyframes boom-ring {
    from { width: 12px; height: 12px; opacity: 0.95; border-width: 6px; }
    to { width: 190px; height: 190px; opacity: 0; border-width: 2px; }
  }
  .boom-flash {
    position: fixed; inset: 0; background: #fff6d5; opacity: 0.32;
    animation: boom-flash 240ms ease-out forwards;
  }
  @keyframes boom-flash { to { opacity: 0; } }
</style>
</head>
<body>
  <div id="layer"></div>
  <script src="marks.js"></script>
</body>
</html>
