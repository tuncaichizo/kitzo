# Linux paketleri (AppImage + deb) Ubuntu uzerinde derlenir, gercekten acildiklari denenir
# ve ancak ondan sonra surume eklenir. Windows kurulumu elle derlenip yayinlandigi icin burada yok.
name: Linux paketleri

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Paketlerin yukleneceği surum etiketi (ornek: v0.4.7)'
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Ses modelleri depoda tutulmuyor; ilk derlemede indirilir, sonrakilerde onbellekten gelir
      - name: Ses modelleri onbellegi
        uses: actions/cache@v4
        with:
          path: models
          key: vosk-models-tr-0.3-en-us-0.15

      - name: Ses modellerini hazirla
        run: >
          node -e "const m=require('./lib/voice-model');(async()=>{await m.ensure('models','tr',()=>{});await
          m.ensure('models','en',()=>{});process.exit(0)})()"

      - name: Paketleri derle
        run: npx electron-builder --linux AppImage deb --publish never

      # Siradan bir Ubuntu 24.04 masaustunu taklit et: libfuse2 yok ve AppArmor
      # kullanici ad alanlarini kisitliyor (CI makinesinde bu kisit varsayilan olarak kapali).
      - name: Deneme ortami
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          if dpkg -s libfuse2t64 >/dev/null 2>&1 || dpkg -s libfuse2 >/dev/null 2>&1; then
            sudo apt-get remove -y libfuse2t64 libfuse2 || true
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true
          # testin bos gecmedigini gormek icin ortami yazdir
          echo "libfuse2: $(ls /usr/lib/x86_64-linux-gnu/libfuse.so.2* 2>/dev/null || echo yok)"
          echo "userns kisiti: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo bilinmiyor)"

      # 30 sn sonra zaman asimiyla kapatilirsa (kod 124) uygulama ayakta demektir; baska her kod hata
      - name: AppImage acilis denemesi
        run: |
          chmod +x dist/*.AppImage
          set +e
          timeout 30 xvfb-run -a dist/Kitzo-*.AppImage > appimage.log 2>&1
          code=$?
          set -e
          tail -30 appimage.log
          if [ "$code" -ne 124 ]; then echo "::error::AppImage acilmadi (cikis kodu $code)"; exit 1; fi
          echo "AppImage acildi ve calismaya devam etti"

      - name: deb kurulum ve acilis denemesi
        run: |
          sudo apt-get install -y ./dist/Kitzo-*-amd64.deb
          set +e
          timeout 30 xvfb-run -a kitzo > deb.log 2>&1
          code=$?
          set -e
          tail -30 deb.log
          if [ "$code" -ne 124 ]; then echo "::error::deb ile kurulan uygulama acilmadi (cikis kodu $code)"; exit 1; fi
          echo "deb paketi kuruldu, uygulama acildi ve calismaya devam etti"

      - name: Surume yukle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.AppImage dist/*.deb --clobber
